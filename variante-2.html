<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fehler-App · Variante 2 — Nachtprotokoll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VARIANTE 2 — "NACHTPROTOKOLL"
   Idee: Ein Logbuch/Flugschreiber. Dunkles Petrolblau statt
   Schwarz, Millimeterpapier-Raster, Messing-Amber als einziges
   Signal. Signature: das Blueprint-Raster + die amberfarbene
   Spine links am Datensatz mit Fadenkreuz-Ecken.
   ============================================================ */

:root{
  --void:   #0B1216;
  --panel:  #0F1A20;
  --line:   #1B2A33;
  --chalk:  #D7E3E2;
  --muted:  #7B9199;
  --amber:  #E0A63C;
  --petrol: #58A79D;

  --f-display:"Bricolage Grotesque", system-ui, sans-serif;
  --f-text:   "IBM Plex Sans", system-ui, sans-serif;
  --f-mono:   "IBM Plex Mono", ui-monospace, monospace;

  --step--1:.78rem; --step-0:.95rem; --step-1:1.15rem;
  --step-2:1.45rem; --step-3:2rem;
  --pad:1.15rem;
  --chrome:34px;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--void); color:var(--chalk);
  font-family:var(--f-text); font-size:var(--step-0); line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(rgba(88,167,157,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(88,167,157,.07) 1px, transparent 1px);
  background-size:22px 22px;
  padding-bottom:env(safe-area-inset-bottom);
  padding-top:calc(var(--chrome) + env(safe-area-inset-top));
}
button,input,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
.app{ max-width:56rem; margin:0 auto; }

.mono{ font-family:var(--f-mono); font-size:var(--step--1); letter-spacing:.06em; }

/* ---------- Statuszeile ---------- */
.statusbar{
  position:sticky; top:calc(var(--chrome) + env(safe-area-inset-top)); z-index:20;
  background:rgba(11,18,22,.94); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:.55rem var(--pad);
  display:flex; justify-content:space-between; align-items:center; gap:1rem;
  font-family:var(--f-mono); font-size:.7rem; letter-spacing:.1em; color:var(--muted);
  text-transform:uppercase;
}
.statusbar .dot{ width:6px; height:6px; background:var(--petrol); border-radius:50%; display:inline-block; margin-right:.5rem; vertical-align:middle; }
.statusbar button{ background:none; border:0; color:var(--muted); cursor:pointer;
  text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line);
  font:inherit; letter-spacing:.1em; text-transform:uppercase; min-height:44px; }
.statusbar button:hover{ color:var(--amber); }

/* ---------- Kopf ---------- */
.head{ padding:2rem var(--pad) 1.5rem; border-bottom:1px solid var(--line); }
.head h1{
  font-family:var(--f-display); font-weight:800;
  font-size:clamp(2rem,10vw,var(--step-3)); line-height:.95; margin:0;
  letter-spacing:-.02em; text-transform:uppercase;
}
.head h1 em{ font-style:normal; color:var(--amber); }
.head .meta{ display:flex; gap:1.5rem; margin-top:.9rem; color:var(--muted); flex-wrap:wrap; }
.head .meta b{ color:var(--chalk); font-weight:500; }

/* ---------- Kommandozeile / Suche ---------- */
.cmd{
  display:flex; align-items:center; gap:.6rem; margin:0 var(--pad);
  border:1px solid var(--line); background:var(--panel);
  padding:0 .8rem; min-height:48px;
  margin-top:1rem;
}
.cmd:focus-within{ border-color:var(--petrol); }
.cmd .slash{ color:var(--amber); font-family:var(--f-mono); }
.cmd input{ flex:1; background:none; border:0; padding:.85rem 0; font-family:var(--f-mono); font-size:.85rem; }
.cmd input:focus{ outline:none; }
.cmd input::placeholder{ color:var(--muted); }
.cmd kbd{ font-family:var(--f-mono); font-size:.65rem; color:var(--muted);
  border:1px solid var(--line); padding:.15rem .35rem; }

/* ---------- Tag-Tokens ---------- */
.tokens{ display:flex; gap:.4rem; overflow-x:auto; scrollbar-width:none; padding:.85rem var(--pad); }
.tokens::-webkit-scrollbar{ display:none; }
.tokens button{
  background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer;
  font-family:var(--f-mono); font-size:.7rem; padding:.4rem .6rem; white-space:nowrap; min-height:34px;
}
.tokens button:hover{ border-color:var(--muted); color:var(--chalk); }
.tokens button[aria-pressed="true"]{ border-color:var(--amber); color:var(--amber); background:rgba(224,166,60,.08); }

/* ---------- Datensätze ---------- */
.records{ list-style:none; margin:0; padding:0 var(--pad) 6rem; display:grid; gap:.75rem; }
.rec{ position:relative; background:var(--panel); border:1px solid var(--line); }
.rec::before{ content:""; position:absolute; left:-1px; top:-1px; bottom:-1px; width:2px; background:var(--line); }
.rec.latest::before{ background:var(--amber); }
/* Fadenkreuz-Ecken — Signature */
.rec::after{
  content:""; position:absolute; right:-1px; top:-1px; width:9px; height:9px;
  border-top:1px solid var(--petrol); border-right:1px solid var(--petrol); opacity:.7;
}
.rec > button{
  all:unset; display:block; width:100%; box-sizing:border-box; cursor:pointer;
  padding:1rem 1rem 1rem 1.1rem;
}
.rec .top{ display:flex; justify-content:space-between; gap:1rem; color:var(--muted);
  font-family:var(--f-mono); font-size:.68rem; letter-spacing:.08em; margin-bottom:.6rem; }
.rec .top .id{ color:var(--petrol); }
.rec.latest .top .id{ color:var(--amber); }
.rec h2{
  font-family:var(--f-display); font-weight:600; font-size:var(--step-1);
  line-height:1.3; margin:0; letter-spacing:-.01em; text-wrap:balance;
}
@media (min-width:40rem){ .rec h2{ font-size:var(--step-2); } }
.rec .tagline{ margin-top:.7rem; display:flex; flex-wrap:wrap; gap:.35rem; }
.rec .tagline span{ font-family:var(--f-mono); font-size:.68rem; color:var(--muted); }
.rec .tagline span::before{ content:"["; color:var(--line); }
.rec .tagline span::after{ content:"]"; color:var(--line); }

.dossier{ display:none; border-top:1px dashed var(--line); padding:1rem 1rem 1.1rem 1.1rem; }
.rec.open .dossier{ display:block; }
.dossier .row{ display:grid; gap:.3rem; padding:.75rem 0; border-bottom:1px solid rgba(27,42,51,.6); }
.dossier .row:last-of-type{ border-bottom:0; }
.dossier dt{ font-family:var(--f-mono); font-size:.65rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--petrol); }
.dossier dd{ margin:0; max-width:62ch; }
.ops{ display:flex; gap:.5rem; margin-top:1rem; }
.ops button{
  background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer;
  font-family:var(--f-mono); font-size:.7rem; letter-spacing:.08em; text-transform:uppercase;
  padding:.6rem .9rem; min-height:40px;
}
.ops button:hover{ border-color:var(--chalk); color:var(--chalk); }
.ops .del:hover{ border-color:#C2564A; color:#E08076; }

/* ---------- Aktion ---------- */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:15;
  padding:.9rem var(--pad) calc(.9rem + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--void) 60%, rgba(11,18,22,0));
}
.dock > div{ max-width:56rem; margin:0 auto; }
.dock button{
  width:100%; min-height:52px; cursor:pointer; background:var(--amber); color:#12191C;
  border:0; font-family:var(--f-mono); font-weight:500; font-size:.78rem;
  letter-spacing:.18em; text-transform:uppercase;
}
.dock button:hover{ background:#EFB852; }
.app{ position:relative; }

/* ---------- Formular ---------- */
.form-view{ display:none; }
body[data-view="form"] .list-view, body[data-view="form"] .dock{ display:none; }
body[data-view="form"] .form-view{ display:block; }
.form-view form{ padding:1.5rem var(--pad) 4rem; }
.tokens button:last-child{ margin-right:var(--pad); }
.fhead{ padding:2rem var(--pad) 1.25rem; border-bottom:1px solid var(--line); }
.fhead .mono{ color:var(--amber); }
.fhead h2{ font-family:var(--f-display); font-weight:800; text-transform:uppercase;
  font-size:var(--step-3); line-height:.95; margin:.5rem 0 0; letter-spacing:-.02em; }
.fld{ margin-bottom:1.5rem; }
.fld label{ display:block; font-family:var(--f-mono); font-size:.68rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--petrol); margin-bottom:.5rem; }
.fld .q{ font-family:var(--f-display); font-weight:600; font-size:var(--step-1); margin:0 0 .6rem; line-height:1.3; }
.fld textarea, .fld input[type=text]{
  width:100%; background:var(--panel); border:1px solid var(--line); color:var(--chalk);
  padding:.75rem .8rem; resize:vertical; min-height:48px; line-height:1.5;
}
.fld textarea:focus, .fld input:focus{ outline:none; border-color:var(--petrol); }
.picks{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.7rem; }
.picks button{ background:none; border:1px solid var(--line); color:var(--muted); cursor:pointer;
  font-family:var(--f-mono); font-size:.7rem; padding:.4rem .6rem; min-height:34px; }
.picks button.on{ border-color:var(--amber); color:var(--amber); background:rgba(224,166,60,.08); }
.fbtns{ display:flex; gap:.6rem; margin-top:2rem; }
.fbtns .save{ flex:1; min-height:52px; background:var(--amber); color:#12191C; border:0; cursor:pointer;
  font-family:var(--f-mono); font-weight:500; font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; }
.fbtns .cancel{ min-height:52px; padding:0 1.1rem; background:none; border:1px solid var(--line); color:var(--muted);
  cursor:pointer; font-family:var(--f-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; }

/* ---------- Vorschau-Leiste (gehört nicht zur App) ---------- */
.pv{ position:fixed; inset:0 0 auto; z-index:60; height:calc(var(--chrome) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) .5rem 0 var(--pad); background:#05090B; color:var(--muted);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  font-family:var(--f-mono); font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; }
.pv .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pv .sw{ display:flex; gap:2px; flex:none; }
.pv button{ border:0; background:none; color:var(--muted); cursor:pointer; padding:.35rem .6rem; font:inherit; }
.pv button[aria-pressed="true"]{ background:var(--amber); color:#12191C; }

@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body data-view="list">
<div class="app">

  <div class="statusbar">
    <span><span class="dot"></span>Sitzung aktiv · luca</span>
    <button type="button">Abmelden</button>
  </div>

  <!-- ============== LISTE ============== -->
  <div class="list-view">
    <header class="head">
      <h1>Fehler<em>protokoll</em></h1>
      <div class="meta mono">
        <span><b>47</b> Einträge</span>
        <span><b>10</b> Tags</span>
        <span>Zuletzt <b>09.08.</b></span>
      </div>
    </header>

    <div class="cmd">
      <span class="slash">/</span>
      <input type="search" placeholder="suchen: volltext über alle einträge" aria-label="Suche">
      <kbd>ESC</kbd>
    </div>

    <nav class="tokens" aria-label="Nach Tag filtern">
      <button aria-pressed="true">alle</button>
      <button aria-pressed="false">kommunikation</button>
      <button aria-pressed="false">technik</button>
      <button aria-pressed="false">prozess</button>
      <button aria-pressed="false">risiko</button>
      <button aria-pressed="false">grenzen</button>
      <button aria-pressed="false">team</button>
    </nav>

    <ul class="records" id="records"></ul>
    <div class="dock"><div><button type="button" onclick="setView('form')">Neuen Eintrag anlegen</button></div></div>
  </div>

  <!-- ============== FORMULAR ============== -->
  <div class="form-view">
    <header class="fhead">
      <div class="mono">Datensatz 048 · Entwurf</div>
      <h2>Neuer<br>Eintrag</h2>
    </header>
    <form onsubmit="return false">
      <div class="fld">
        <label for="v2a">Feld 01 · fehler</label>
        <p class="q">Was für einen Fehler habe ich gemacht?</p>
        <textarea id="v2a" rows="3" placeholder="Der Vorgang, so nüchtern wie möglich."></textarea>
      </div>
      <div class="fld">
        <label for="v2b">Feld 02 · learning</label>
        <p class="q">Was lerne ich daraus?</p>
        <textarea id="v2b" rows="3" placeholder="Die Erkenntnis, die übrig bleibt."></textarea>
      </div>
      <div class="fld">
        <label for="v2c">Feld 03 · vermeidung</label>
        <p class="q">Wie vermeide ich ihn in Zukunft?</p>
        <textarea id="v2c" rows="3" placeholder="Eine Regel, die ohne Nachdenken funktioniert."></textarea>
      </div>
      <div class="fld">
        <label for="v2d">Feld 04 · tags</label>
        <input id="v2d" type="text" placeholder="kommunikation, team">
        <div class="picks">
          <button type="button" class="on">kommunikation</button>
          <button type="button">team</button>
          <button type="button">technik</button>
          <button type="button">prozess</button>
          <button type="button">risiko</button>
          <button type="button">grenzen</button>
          <button type="button">emotionen</button>
          <button type="button">kunde</button>
        </div>
      </div>
      <div class="fbtns">
        <button type="button" class="save">Speichern</button>
        <button type="button" class="cancel" onclick="setView('list')">Abbrechen</button>
      </div>
    </form>
  </div>
</div>

<div class="pv">
  <span class="name">Variante 2 · Nachtprotokoll</span>
  <span class="sw" role="group" aria-label="Vorschau umschalten">
    <button id="pv-list" aria-pressed="true" onclick="setView('list')">Liste</button>
    <button id="pv-form" aria-pressed="false" onclick="setView('form')">Formular</button>
  </span>
</div>

<script>
const DATA = [
  {no:"047",datum:"09.08.2026 · 18:40",fehler:"Ich habe das Release am Freitagabend ausgerollt, kurz bevor ich ins Wochenende gefahren bin.",learning:"Ein Deployment ist erst fertig, wenn jemand es beobachtet hat. Freitagabend beobachtet niemand — auch ich nicht.",vermeidung:"Releases nur Dienstag bis Donnerstag vor 15 Uhr. Freitag ist Review-Tag, kein Deploy-Tag.",tags:["technik","prozess","risiko"]},
  {no:"046",datum:"07.08.2026 · 11:05",fehler:"Ich habe Marie im Meeting widersprochen, ohne ihre Zahlen vorher gelesen zu haben.",learning:"Mein Widerspruch war schneller als mein Verständnis. Das kostet Vertrauen, nicht nur Zeit.",vermeidung:"Erst eine echte Frage stellen, bevor ich eine Gegenposition formuliere.",tags:["kommunikation","team"]},
  {no:"045",datum:"05.08.2026 · 09:12",fehler:"Ich habe zugesagt, den Workshop zu übernehmen, obwohl die Woche schon voll war.",learning:"Ich sage Ja zur Anerkennung, nicht zur Aufgabe. Das merke ich immer erst am Mittwoch.",vermeidung:"24 Stunden Bedenkzeit bei allem, was länger als zwei Stunden dauert.",tags:["grenzen","selbstorganisation"]},
  {no:"044",datum:"02.08.2026 · 22:31",fehler:"Ich habe die Datenbank migriert, ohne vorher ein Backup zu ziehen.",learning:"Ich habe auf mein Können vertraut statt auf ein Verfahren. Können hat keine Undo-Funktion.",vermeidung:"Checkliste vor jeder Migration: Backup ziehen, Restore einmal testen, dann erst starten.",tags:["technik","risiko"]},
  {no:"043",datum:"31.07.2026 · 16:58",fehler:"Ich habe die Mail an den Kunden im Ärger geschrieben und sofort abgeschickt.",learning:"Der erste Entwurf gehört mir, der zweite dem Empfänger. Ich habe den ersten verschickt.",vermeidung:"Bei Ärger: Entwurf ohne Empfänger schreiben und eine Nacht liegen lassen.",tags:["kommunikation","emotionen"]},
  {no:"042",datum:"28.07.2026 · 14:20",fehler:"Ich habe im Kundentermin meine Annahmen präsentiert, statt Fragen zu stellen.",learning:"Ich habe 40 Minuten geredet und nichts erfahren, was ich vorher nicht schon zu wissen glaubte.",vermeidung:"Die ersten 15 Minuten jedes Termins: nur Fragen, kein Slide.",tags:["kunde","kommunikation"]}
];
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('records').innerHTML = DATA.map((e,i)=>`
  <li class="rec${i===0?' latest open':''}">
    <button type="button" onclick="this.parentElement.classList.toggle('open')" aria-expanded="${i===0}">
      <div class="top"><span class="id">#${e.no}</span><span>${e.datum}</span></div>
      <h2>${esc(e.fehler)}</h2>
      <div class="tagline">${e.tags.map(t=>`<span>${t}</span>`).join('')}</div>
    </button>
    <dl class="dossier">
      <div class="row"><dt>Learning</dt><dd>${esc(e.learning)}</dd></div>
      <div class="row"><dt>Vermeidung</dt><dd>${esc(e.vermeidung)}</dd></div>
      <div class="ops"><button type="button">Bearbeiten</button><button type="button" class="del">Löschen</button></div>
    </dl>
  </li>`).join('');

function setView(v){
  document.body.dataset.view = v;
  document.getElementById('pv-list').setAttribute('aria-pressed', v==='list');
  document.getElementById('pv-form').setAttribute('aria-pressed', v==='form');
  window.scrollTo(0,0);
}
document.querySelectorAll('.picks button').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
document.querySelectorAll('.tokens button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tokens button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
});
</script>
</body>
</html>
